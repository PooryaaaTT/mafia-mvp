<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mafia MVP</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#292b38,#0d0e12 48%);color:#fff;font-family:Tahoma,Arial;padding:22px}.w{max-width:760px;margin:auto}.c{background:#181a20f2;border:1px solid #30333d;border-radius:24px;padding:24px;margin-bottom:15px;box-shadow:0 24px 70px #0008}h1{font-size:36px;margin:0 0 6px}.muted{color:#9da3ae;margin-bottom:18px}input,button{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #30333d;font-size:16px;margin:6px 0}input{background:#101218;color:white}button{background:white;color:#111;font-weight:bold;cursor:pointer}.red{background:#e5484d;color:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none}.rc{text-align:center;font-size:40px;font-weight:900;letter-spacing:5px}.link{direction:ltr;word-break:break-all;background:#101218;padding:12px;border-radius:12px;color:#cbd0d8}.phase{text-align:center;font-size:22px;padding:13px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:15px 0}.p{background:#111318;border:1px solid #30333d;border-radius:16px;padding:15px;text-align:center}.dot{display:inline-block;width:9px;height:9px;background:#35c759;border-radius:50%;margin-left:6px}.host{font-size:11px;color:#ff9fa3}.role{text-align:center;font-size:24px;border:1px dashed #666;border-radius:14px;padding:13px;margin:12px 0}.note{color:#9da3ae;font-size:13px;line-height:1.8}</style></head><body><div class="w">
<div class="c" id="home"><h1>MAFIA</h1><div class="muted">اتاق آنلاین چندنفره — نسخه آزمایشی</div><input id="name" placeholder="اسم شما"><input id="code" placeholder="کد اتاق"><div class="row"><button id="create">ساخت اتاق</button><button id="join">ورود به اتاق</button></div></div>
<div class="c hide" id="room"><div class="muted">کد اتاق</div><div class="rc" id="rc"></div><div class="link" id="link"></div><button id="copy">کپی لینک دعوت</button><div class="phase" id="phase">LOBBY</div><div class="role hide" id="role"></div><div class="players" id="players"></div><div class="row"><button class="red" id="start">شروع بازی</button><button id="toggle">روز / شب</button></div><div class="note">فعلاً برای تست: ساخت اتاق، لینک دعوت، حضور لحظه‌ای بازیکنان و نقش مخفی. Voice مرحله بعد اضافه می‌شود.</div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const s=io();let c=null,id=null,ph="lobby";const $=x=>document.getElementById(x);const q=new URLSearchParams(location.search);if(q.get("room"))$("code").value=q.get("room");
function enter(x){c=x;$("home").classList.add("hide");$("room").classList.remove("hide");$("rc").textContent=x;const u=location.origin+"/?room="+x;$("link").textContent=u;history.replaceState({},"","?room="+x)}
$("create").onclick=()=>s.emit("room:create",{name:$("name").value.trim()||"Player"},r=>{if(r.ok){id=r.playerId;enter(r.code)}});
$("join").onclick=()=>{let x=$("code").value.trim();if(!x)return alert("کد اتاق را وارد کن");s.emit("room:join",{code:x,name:$("name").value.trim()||"Player"},r=>{if(r.ok){id=r.playerId;enter(r.code)}else alert(r.error)})};
$("copy").onclick=async()=>{await navigator.clipboard.writeText($("link").textContent);$("copy").textContent="کپی شد ✓";setTimeout(()=>$("copy").textContent="کپی لینک دعوت",1200)};
$("start").onclick=()=>s.emit("game:start",{code:c},r=>{if(!r?.ok)alert(r.error)});
$("toggle").onclick=()=>s.emit("phase:set",{code:c,phase:ph==="night"?"day":"night"});
s.on("room:update",r=>{ph=r.phase;$("phase").textContent=r.started?(r.phase==="night"?"🌙 شب":"☀️ روز"):"LOBBY";$("players").innerHTML=r.players.map(p=>'<div class="p"><span class="dot"></span>'+p.name+(p.host?'<div class="host">HOST</div>':'')+'</div>').join("");const me=r.players.find(p=>p.id===id);$("start").style.display=me?.host?"block":"none";$("toggle").style.display=me?.host&&r.started?"block":"none"});
s.on("role:assigned",x=>{const n={mafia:"🔪 مافیا",doctor:"🩺 دکتر",detective:"🕵️ کارآگاه",citizen:"🏙️ شهروند"};$("role").classList.remove("hide");$("role").textContent="نقش شما: "+n[x.role]});
</script></body></html>
